<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隐私政策 - 办公室搜打撤</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #111;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px 56px;
      }
      h1, h2 {
        margin: 0 0 12px;
      }
      section {
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 18px;
        padding: 22px;
        margin-bottom: 14px;
      }
      p, li {
        line-height: 1.7;
      }
      ul {
        margin: 10px 0 0 20px;
      }
      .muted {
        color: #666;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>隐私政策</h1>
      <p class="muted">最后更新：2026-05-20</p>

      <section>
        <p>
          《办公室搜打撤》是一款记录打工生活日常的APP，我们始终坚持最小化数据收集原则，尊重并保护你的个人隐私。
        </p>
        <ul>
          <li>应用数据记录与个性化设置均仅存储在你的设备本地，不会上传至服务器。</li>
          <li>应用无需注册账号，不强制绑定手机号、社交账号或其他身份信息。</li>
          <li>我们不会主动收集你的姓名、联系方式、地理位置等个人敏感信息。</li>
          <li>应用未集成任何第三方统计、广告或推送 SDK，无第三方数据共享行为。</li>
          <li>若后续版本新增涉及数据收集的功能（如云存档、排行榜等），我们将提前更新本政策并明确告知你。</li>
        </ul>
      </section>
    </main>
  </body>
</html>
