<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>技术支持 - 办公室搜打撤</title>
  <meta name="description" content="《办公室搜打撤》官方支持页面" />
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #666;
      --border: rgba(0,0,0,.08);
      --accent: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #faf8f4 0%, #f2efe8 100%);
      color: var(--text);
      line-height: 1.7;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.15;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      margin-top: 16px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }
    p {
      margin: 0 0 12px;
    }
    a { color: var(--accent); }
    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 720px) {
      .hero { padding: 24px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>技术支持</h1>
      <p class="sub">遇到任何问题，欢迎随时联系我们</p>
    </section>

    <section class="card">
      <h2>联系我们</h2>
      <p>
        如果你在游戏中遇到闪退、卡关、功能异常，或有玩法建议、合作意向，可以通过以下邮箱反馈：
      </p>
      <p>
        <a href="mailto:740168305@qq.com">740168305@qq.com</a>
      </p>
      <p>
        为了更快定位问题，请尽量在邮件中说明：<br />
        1. 你的设备型号（如 iPhone 15 Pro / iPad Air 5）<br />
        2. 系统版本（如 iOS 18.2）<br />
        3. 具体问题描述（可附截图或录屏）
      </p>
    </section>

    <section class="card">
      <h2>隐私政策</h2>
      <p>
        <a href="privacy.html">查看《办公室搜打撤》隐私政策</a>
      </p>
    </section>

    <p class="footer">© 2026 办公室搜打撤 开发团队</p>
  </main>
</body>
</html>
